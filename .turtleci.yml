version: 1
jobs:
  build-and-test:
    # Specifies the macOS environment and target operating system version
    os: macos
    xcode: "15.4" # Optional: Pin your required Xcode version
    
    steps:
      - checkout
      
      - name: Install Dependencies
        command: |
          pod install --repo-update # For CocoaPods projects, or use Swift Package Manager
          
      - name: Run Tests
        command: |
          xcodebuild test -workspace MyApp.xcworkspace -scheme MyApp -destination 'platform=iOS Simulator,name=iPhone 15'
